<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#C9D2FF"><title>云朵喵 · 授权码生成器</title>
<style>
:root{--ink:#4B3B5C;--soft:#8E7FA0;--pink:#FF7FAE;--pink-d:#EC5C93;--line:#EBDDF0;--mint-d:#3FB598;--coral:#F26D85;--butter-l:#FFF3CF}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.6 "Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;background:linear-gradient(160deg,#B9D4FF,#D9CFFF 50%,#FFD3E6) fixed;padding:22px}
.wrap{max-width:680px;margin:0 auto}
h1{font-size:23px;margin:0 0 2px}.sub{color:#6B5A80;margin:0 0 16px;font-size:14px}
.panel{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:18px 20px;box-shadow:0 4px 0 var(--ink);margin-bottom:16px;animation:rise .4s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
label{display:block;margin-bottom:12px}label>span{display:block;font-weight:700;margin-bottom:5px}label em{font-style:normal;font-weight:400;color:var(--soft);font-size:13px;margin-left:6px}
.in{width:100%;border:2.5px solid #E6CADB;border-radius:14px;padding:9px 14px;background:#FFFBFD;outline:none;font:inherit;color:inherit}
.in:focus{border-color:var(--pink);box-shadow:0 0 0 4px #FFD9E8}
.mono{font-family:Consolas,monospace;letter-spacing:1px}
.seg{display:inline-flex;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:#fff;padding:5px 15px;cursor:pointer;font:inherit;color:inherit}.seg button.on{background:var(--pink);color:#fff;font-weight:700}
.btn{cursor:pointer;border:2.5px solid var(--ink);border-radius:999px;padding:9px 26px;font:inherit;font-weight:700;background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:hover{background:var(--pink-d)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:#fff;color:var(--ink)}.btn.sm{padding:3px 12px;font-size:13px;box-shadow:0 3px 0 var(--ink)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.err{color:var(--coral);font-weight:700;margin-top:8px}
.out{background:var(--butter-l);border:2px dashed #E5C767;border-radius:14px;padding:12px 14px;word-break:break-all;margin:10px 0;user-select:all;animation:rise .3s both}
.warn{font-size:13px;background:#FFE6EA;border-radius:12px;padding:8px 12px;color:#B23650}
.rec{border-top:2px dotted var(--line);padding:8px 0;font-size:13px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.rec b{font-size:14px}.rec span{color:var(--soft)}
</style></head><body><div class="wrap">
<h1>🔑 授权码生成器</h1>
<p class="sub">对方打开「云朵喵 VPN 搭建助手」会看到一个机器码。把机器码填到这里，生成授权码发回给他。授权码只能在他那一台电脑上用。</p>
<div class="panel">
  <label><span>对方的机器码</span><input class="in mono" id="m" placeholder="ABCD-EFGH-IJKL-MNOP" spellcheck="false" autocomplete="off"></label>
  <label><span>备注<em>给谁的，方便以后查</em></span><input class="in" id="n" placeholder="例如：小王的笔记本"></label>
  <label><span>有效期</span>
    <div class="row"><div class="seg" id="seg"><button class="on" data-d="0">永久</button><button data-d="30">30 天</button><button data-d="90">90 天</button><button data-d="365">一年</button><button data-d="-1">自选日期</button></div>
    <input class="in" type="date" id="date" style="width:170px" hidden></div></label>
  <div class="row"><button class="btn" id="go">生成授权码</button></div>
  <div class="err" id="err"></div>
  <div id="res" hidden><div class="out mono" id="code"></div><div class="row"><button class="btn ghost" id="copy">复制授权码</button><span id="tip" style="color:var(--mint-d);font-weight:700"></span></div></div>
</div>
<div class="warn">⚠️ 这个生成器只能自己留着，不要发给任何人。拿到它的人可以给任意电脑生成授权码。</div>
<div class="panel" style="margin-top:16px"><b>发过的授权码</b><div id="list"></div></div>
</div>
<script>
const $=s=>document.querySelector(s),T=(location.hash.match(/t=([0-9a-f]+)/)||[])[1]||"";
async function api(p,b){const r=await fetch("/api/"+p,{method:"POST",headers:{"X-Token":T},body:JSON.stringify(b||{})});const j=await r.json();if(!j.ok)throw new Error(j.err||"出错了");return j}
setInterval(()=>api("ping").catch(()=>{}),5000);
let days=0;
$("#seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;days=+b.dataset.d;[...$("#seg").children].forEach(x=>x.classList.toggle("on",x===b));$("#date").hidden=days!==-1};
function expires(){if(days===0)return"";if(days===-1)return $("#date").value;const d=new Date(Date.now()+days*864e5);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function copy(t,el){navigator.clipboard.writeText(t).then(()=>{el.textContent="已复制 ✓";setTimeout(()=>el.textContent="",1800)})}
function draw(recs){const l=$("#list");l.innerHTML="";if(!recs||!recs.length){l.innerHTML='<p style="color:var(--soft);font-size:14px;margin:8px 0 0">还没有发过</p>';return}
 recs.forEach(r=>{const d=document.createElement("div");d.className="rec";const a=document.createElement("div");const b=document.createElement("b");b.textContent=r.note||"（没写备注）";const s=document.createElement("span");s.textContent=` ${r.machine} · ${r.expires?"到 "+r.expires:"永久"} · ${r.time}`;a.append(b,document.createElement("br"),s);
 const c=document.createElement("button");c.className="btn ghost sm";c.textContent="复制";c.onclick=()=>{navigator.clipboard.writeText(r.code);c.textContent="已复制";setTimeout(()=>c.textContent="复制",1500)};d.append(a,c);l.append(d)})}
$("#go").onclick=async()=>{$("#err").textContent="";try{if(days===-1&&!$("#date").value)throw new Error("请选择到期日期");const r=await api("make",{Machine:$("#m").value,Note:$("#n").value,Expires:expires()});$("#code").textContent=r.code;$("#res").hidden=false;draw(r.records)}catch(e){$("#err").textContent=e.message;$("#res").hidden=true}};
$("#copy").onclick=()=>copy($("#code").textContent,$("#tip"));
api("list").then(r=>draw(r.records)).catch(()=>{});
</script></body></html>
